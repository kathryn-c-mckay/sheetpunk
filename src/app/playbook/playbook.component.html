<h1>{{playbookData.name}}</h1>
<article>
    <h2>Playbook Moves</h2>
    <ul>
        <li><strong>The Move</strong> - 'Merican Punch</li>
    </ul>
</article>
<article>
    <h2>Abilities</h2>
    <shepu-abilities [abilities]="playbookData.abilities"></shepu-abilities>
</article>
<article>
    <h2>Conditions</h2>
    <ul class="shepu-conditions">
        @for (condition of playbookData.conditions; track $index) {
            <li>{{ condition }}</li>
        }
    </ul>
</article>
